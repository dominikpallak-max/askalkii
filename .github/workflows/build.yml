name: Build Askalki

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Jave 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zbuduj mода
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Wrzuć jara do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: askalki-jar
          path: build/libs/*.jar
